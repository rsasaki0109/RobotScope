[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotscope-sdk"
version = "0.1.0"
description = "ROS-independent robot telemetry in standard JSON MCAP"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["mcap>=1.3.1,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["robotscope*"]
